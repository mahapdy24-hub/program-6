<!DOCTYPE html>
<html>

<head>

<title>Current Date</title>

<script>

function displayDate()
{
    var days =
    [
        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday"
    ];

    var months =
    [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December"
    ];

    var date = new Date();

    var day = days[date.getDay()];
    var month = months[date.getMonth()];
    var year = date.getFullYear();

    document.getElementById("result").innerHTML =
        day + ", " + month + " " +
        date.getDate() + ", " + year;
}

</script>

</head>

<body>

<h2>Current Date</h2>

<input type="button"
       value="Display Date"
       onclick="displayDate()">

<p id="result"></p>

</body>

</html>
